<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none"><title>Nordic dark application shell background</title><defs>
<linearGradient id="blueDeep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#006AA7"/><stop offset="1" stop-color="#003580"/></linearGradient>
<linearGradient id="navyGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123B68"/><stop offset="1" stop-color="#06162A"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE47A"/><stop offset=".5" stop-color="#FECC02"/><stop offset="1" stop-color="#E3A900"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".5" stop-color="#DDE7F0"/><stop offset="1" stop-color="#AABBCB"/></linearGradient>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#001C46" flood-opacity=".22"/></filter>
<filter id="smallShadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#001C46" flood-opacity=".18"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<radialGradient id="auroraA" cx="0" cy="0" r="1" gradientTransform="translate(950 250) rotate(130) scale(620 320)"><stop stop-color="#6CE5D7" stop-opacity=".35"/><stop offset="1" stop-color="#6CE5D7" stop-opacity="0"/></radialGradient>
<radialGradient id="auroraB" cx="0" cy="0" r="1" gradientTransform="translate(1120 180) rotate(150) scale(520 280)"><stop stop-color="#FECC02" stop-opacity=".18"/><stop offset="1" stop-color="#FECC02" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.2" fill="#fff" opacity=".12"/></pattern>
</defs>
<rect width="1440" height="900" fill="url(#navyGlow)"/>
<rect width="1440" height="900" fill="url(#dots)"/>
<path d="M-120-40h470v1100H170V310h-290V80h290V-40Z" fill="#003580" opacity=".22"/>
<path d="M1110-60h190v1040h-190V620H760V430h350V-60Z" fill="#FECC02" opacity=".12"/>
<ellipse cx="960" cy="250" rx="620" ry="320" fill="url(#auroraA)"/>
<ellipse cx="1130" cy="170" rx="520" ry="280" fill="url(#auroraB)"/>
<path d="M0 720C250 620 430 770 670 675s470-110 770-25v250H0Z" fill="#0D2D50" opacity=".9"/>
</svg>