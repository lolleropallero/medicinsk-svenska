<linearGradient id="lightBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFE"/><stop offset=".55" stop-color="#EAF3FB"/><stop offset="1" stop-color="#D7E9F7"/></linearGradient>
