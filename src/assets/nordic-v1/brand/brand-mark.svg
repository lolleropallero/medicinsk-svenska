    <path d="M34 0h20v112H34zM0 44h112v20H0z" fill="url(#gold)"/>
  </g>
</g>
<path d="M73 92h33l12-23 19 42 18-32 14 13h24" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#smallShadow)"/>
<path d="M73 92h33l12-23 19 42 18-32 14 13h24" fill="none" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
